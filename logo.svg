<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 56" width="310" height="56" fill="none">
  <!-- 1. ROYAL JEWEL & DIAMOND EMBLEM -->
  <g transform="translate(3, 3)">
    <!-- Outer Octagonal Facet Contour -->
    <polygon points="25,1 42,8 50,25 42,42 25,49 8,42 1,25 8,8" 
             stroke="#b8935e" stroke-width="1.6" fill="rgba(197, 168, 128, 0.10)" />
    
    <!-- Inner Radiant Diamond Facets -->
    <polygon points="25,6 44,17 36,41 25,46 14,41 6,17" 
             stroke="#9a7647" stroke-width="1.1" fill="none" opacity="0.90" />
             
    <!-- Brilliant Cut Table Facet -->
    <polygon points="17,17 33,17 38,28 25,42 12,28" 
             stroke="#c5a880" stroke-width="1.0" fill="none" />
             
    <line x1="25" y1="6" x2="25" y2="17" stroke="#c5a880" stroke-width="1.0" />
    <line x1="17" y1="17" x2="6" y2="17" stroke="#c5a880" stroke-width="1.0" />
    <line x1="33" y1="17" x2="44" y2="17" stroke="#c5a880" stroke-width="1.0" />
    <line x1="25" y1="42" x2="25" y2="46" stroke="#c5a880" stroke-width="1.0" />
    
    <!-- Imperial 5-Point Coronet Arch -->
    <path d="M15 26 L19 21 L25 25 L31 21 L35 26 Z" fill="#b8935e" />
    <circle cx="19" cy="20" r="1.3" fill="#eed8b7" />
    <circle cx="25" cy="18.5" r="1.8" fill="#ffffff" stroke="#b8935e" stroke-width="0.8" />
    <circle cx="31" cy="20" r="1.3" fill="#eed8b7" />
    
    <!-- Starburst Solitaire Sparkle -->
    <path d="M25 10 Q25 14 21 14 Q25 14 25 18 Q25 14 29 14 Q25 14 25 10 Z" fill="#c5a880" />
  </g>

  <!-- 2. LUXURY MAISON WORDMARK -->
  <text x="63" y="30" 
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" 
        font-size="23.5" 
        font-weight="700" 
        letter-spacing="3.8px" 
        fill="#141210">AURA &amp; ARTISAN</text>

  <line x1="64" y1="36" x2="300" y2="36" stroke="#c5a880" stroke-width="1.0" opacity="0.70" />

  <text x="64" y="47" 
        font-family="'Montserrat', -apple-system, sans-serif" 
        font-size="7.4" 
        font-weight="600" 
        letter-spacing="2.8px" 
        fill="#9a7647">HAUTE JOAILLERIE &bull; JAIPUR &bull; MUMBAI</text>
</svg>